<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps on {{LABEL}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.08);
    --accent: #ff3b30; --accent-soft: rgba(255,59,48,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --surface: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.10);
            --accent: #ff453a; --accent-soft: rgba(255,69,58,.16); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 10px 16px;
           align-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent);
           backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  input[type=search] { width: 220px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
                       background: var(--surface); color: var(--text); font: inherit; }
  button { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
           color: var(--text); font: inherit; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:disabled { opacity: .4; cursor: default; }
  button[aria-pressed=true] { background: var(--text); color: var(--bg); }
  main { padding: 8px 24px 120px; max-width: 1400px; margin: 0 auto; }
  h2 { font-size: 15px; margin: 24px 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .count { font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px 12px;
         background: var(--surface); border: 1.5px solid transparent; border-radius: 16px; cursor: pointer; text-align: center;
         transition: transform .12s ease, border-color .12s ease, background .12s ease; }
  .app:hover { transform: translateY(-1px); border-color: var(--line); }
  .app:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .app input { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .app img, .placeholder { width: 64px; height: 64px; border-radius: 22.5%; box-shadow: 0 0 0 .5px var(--line); }
  .placeholder { display: grid; place-items: center; font-size: 28px; font-weight: 600; color: #fff;
                 background: linear-gradient(135deg, #8e8e93, #48484a); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .bundle { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .hidden { display: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; pointer-events: none;
           transition: opacity .2s ease, transform .2s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); width: min(560px, 90vw); }
  dialog textarea { width: 100%; height: 280px; font: 12px ui-monospace, monospace; background: var(--bg); color: var(--text);
                    border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
</style>
</head>
<body>
<header>
  <h1>Apps on {{LABEL}}<small>{{TOTAL}} removable</small></h1>
  <div class="tools">
    <input type="search" id="q" placeholder="Search apps" autocomplete="off">
    <button id="only" aria-pressed="false">Selected only</button>
    <button id="all">Select visible</button>
    <button id="none">Clear</button>
    <button id="copy" class="primary" disabled>Copy 0 apps</button>
  </div>
</header>
<main>{{SECTIONS}}</main>
<div class="toast" id="toast"></div>
<dialog id="fallback">
  <p>Copy this list and paste it to Claude:</p>
  <textarea id="fallback-text" readonly></textarea>
  <form method="dialog"><button>Close</button></form>
</dialog>
<script>
  const boxes = [...document.querySelectorAll('.app input')];
  const cards = [...document.querySelectorAll('.app')];
  const q = document.getElementById('q');
  const only = document.getElementById('only');
  const copy = document.getElementById('copy');
  const KEY = 'app-removal:' + document.title;

  const stored = localStorage.getItem(KEY);
  if (stored !== null) {
    const saved = new Set(JSON.parse(stored));
    boxes.forEach(b => { b.checked = saved.has(b.dataset.bundle); });
  }

  function selected() { return boxes.filter(b => b.checked); }

  function refresh() {
    const term = q.value.trim().toLowerCase();
    const onlySel = only.getAttribute('aria-pressed') === 'true';
    cards.forEach(c => {
      const box = c.querySelector('input');
      c.classList.toggle('hidden', (term && !c.dataset.search.includes(term)) || (onlySel && !box.checked));
    });
    const n = selected().length;
    copy.textContent = `Copy ${n} app${n === 1 ? '' : 's'}`;
    copy.disabled = n === 0;
    localStorage.setItem(KEY, JSON.stringify(selected().map(b => b.dataset.bundle)));
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  boxes.forEach(b => b.addEventListener('change', refresh));
  q.addEventListener('input', refresh);
  only.addEventListener('click', () => {
    only.setAttribute('aria-pressed', only.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    refresh();
  });
  document.getElementById('all').addEventListener('click', () => {
    cards.forEach(c => { if (!c.classList.contains('hidden')) c.querySelector('input').checked = true; });
    refresh();
  });
  document.getElementById('none').addEventListener('click', () => { boxes.forEach(b => { b.checked = false; }); refresh(); });
  copy.addEventListener('click', async () => {
    const sel = selected();
    const text = `Please uninstall these ${sel.length} apps from {{LABEL}}:\n` +
      sel.map(b => `- ${b.dataset.name} (${b.dataset.bundle})`).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      toast(`Copied ${sel.length} apps`);
    } catch {
      document.getElementById('fallback-text').value = text;
      document.getElementById('fallback').showModal();
      document.getElementById('fallback-text').select();
    }
  });
  refresh();
</script>
</body>
</html>
